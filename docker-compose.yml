services:
  db:
    image: mysql:8.4
    container_name: vuelos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: crud_usuarios
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecuta una sola vez, la primera vez que arranca con el volumen vacío.
      - ./Infrastructure/Adapters/Persistence/MySQL/Database/mysql/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      # Se usa 127.0.0.1 (TCP) para no dar por listo el servidor temporal de inicialización.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    container_name: vuelos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: crud_usuarios
      DB_USERNAME: Estudiante
      DB_PASSWORD: Developer
      DB_CHARSET: utf8mb4
      # Se toma del archivo .env. Si queda vacía, la API rechaza las peticiones protegidas.
      API_KEY: ${API_KEY:-}

volumes:
  db_data: